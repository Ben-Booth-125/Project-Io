<!-- Project Io — UI drill-down exemplar: Corporation Dashboard (fold/full-screen 2-level + BL-196 subject drill, x4 cards + scenario switch) -->
<title>Genom Systems — Corporation Dashboard (exemplar)</title>
<div class="app">
  <header class="topbar">
    <div class="topbar-left">
      <h1>Genom Systems</h1>
      <span class="topbar-sub">Corporation</span>
    </div>
    <div class="topbar-right">
      <span class="sim-time" id="simTime"></span>
      <div class="scenario-switch" id="scenarioSwitch"></div>
    </div>
  </header>
  <main class="dashboard" id="dashboard"></main>
</div>

<!-- FULL SCREEN expanded card view: level 2, everything at once -->
<div class="fs-overlay" id="fsOverlay" hidden>
  <div class="fs-inner">
    <div class="fs-header" id="fsHeader"></div>
    <div class="fs-body" id="fsBody"></div>
  </div>
</div>

<style>
:root{
  --bg:#05070b;
  --panel-bg:#0c1018;
  --card-bg:#0a0d14;
  --border:#2a3140;
  --text:#d6dae2;
  --text-dim:#aeb3bd;
  --text-dimmer:#8c92a0;
  --accent:#3D84E0;
  --green:#6EC878;
  --red:#D86460;
  --grey:#AAAFB9;
  --hover:#78BEFF;
  --amber:#FFC85A;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Segoe UI",Inter,system-ui,-apple-system,sans-serif;
  font-size:13px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}

/* ---------- Top bar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 22px; border-bottom:1px solid var(--border); background:var(--panel-bg);
}
.topbar-left{ display:flex; align-items:baseline; gap:9px; }
.topbar-left h1{ font-size:15px; font-weight:700; margin:0; color:var(--text); letter-spacing:0.2px; }
.topbar-sub{ font-size:12px; color:var(--text-dimmer); }
.topbar-right{ display:flex; align-items:center; gap:16px; }
.sim-time{ font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.scenario-switch{ display:flex; border:1px solid var(--border); border-radius:2px; overflow:hidden; }
.scenario-switch button{
  background:var(--card-bg); color:var(--text-dim); border:none; border-right:1px solid var(--border);
  padding:6px 12px; font-size:12px; cursor:pointer;
}
.scenario-switch button:last-child{ border-right:none; }
.scenario-switch button.active{ background:var(--accent); color:#fff; }
.scenario-switch button:not(.active):hover{ color:var(--hover); }

/* ---------- Dashboard grid (folded resting state) ---------- */
.dashboard{
  display:grid; grid-template-columns:1fr 1fr; gap:14px;
  padding:22px; max-width:1080px; margin:0 auto;
}
@media (max-width:760px){ .dashboard{ grid-template-columns:1fr; } }

.card{
  background:var(--card-bg); border:1px solid var(--border); border-radius:2px;
}
.card-row{
  display:flex; align-items:center; gap:12px; padding:13px 14px; cursor:pointer;
  transition:background 120ms ease;
}
.card-row:hover{ background:#0d121b; }
.card-title{ font-size:13px; font-weight:600; color:var(--text); min-width:88px; flex-shrink:0; }
.card-verdict{ flex:1; font-size:13px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.go-to-btn{
  background:transparent; border:1px solid var(--border); color:var(--text-dimmer);
  font-size:11px; padding:2px 7px; border-radius:2px; cursor:default; opacity:0.7; flex-shrink:0;
}
.fold-chevron-btn{
  appearance:none; background:none; border:1px solid var(--border); color:var(--text-dim);
  width:22px; height:20px; border-radius:2px; cursor:pointer; flex-shrink:0; font-size:10px;
  display:flex; align-items:center; justify-content:center;
}
.fold-chevron-btn:hover{ border-color:var(--hover); color:var(--hover); }

/* ---------- Full-screen expanded view ---------- */
.fs-overlay{
  position:fixed; inset:0; z-index:50; background:var(--bg);
  opacity:0; pointer-events:none; transition:opacity 200ms ease; overflow-y:auto;
}
.fs-overlay.open{ opacity:1; pointer-events:auto; }
.fs-inner{ width:min(880px, calc(100% - 96px)); margin:56px auto 64px; }
.fs-header{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding-bottom:16px; margin-bottom:26px; border-bottom:1px solid var(--border);
}
.fs-breadcrumb{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:16px; color:var(--text-dimmer); }
.fs-breadcrumb .crumb-seg{ background:none; border:none; padding:0; cursor:pointer; font-size:16px; color:var(--text-dimmer); }
.fs-breadcrumb .crumb-seg:hover{ color:var(--hover); }
.fs-breadcrumb .crumb-seg.current{ color:var(--text); font-weight:600; cursor:default; }
.fs-breadcrumb .crumb-sep{ opacity:.5; }
.fs-header-controls{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
.fs-back-btn{
  background:none; border:1px solid var(--border); color:var(--text-dim);
  width:26px; height:26px; border-radius:2px; cursor:pointer; font-size:15px;
}
.fs-back-btn:hover{ border-color:var(--hover); color:var(--hover); }
.fs-fold-btn{
  appearance:none; background:none; border:1px solid var(--border); color:var(--text-dim);
  padding:6px 11px; border-radius:2px; cursor:pointer; display:flex; align-items:center; gap:7px; font-size:12.5px;
}
.fs-fold-btn:hover{ border-color:var(--hover); color:var(--hover); }

.fs-verdict{ display:flex; align-items:center; gap:10px; font-size:19px; color:var(--text); margin-bottom:4px; }
.fs-verdict.clickable{ cursor:pointer; }
.fs-verdict.clickable:hover{ color:var(--hover) !important; }
.fs-verdict .glyph{ width:11px; height:11px; border-radius:50%; flex-shrink:0; }
.fs-sub{ font-size:12px; color:var(--text-dimmer); margin-bottom:24px; }

.fs-chart-block{ margin-bottom:26px; max-width:640px; }
.fs-chart-svg{ width:100%; height:auto; display:block; }
.fs-gridline{ stroke:var(--border); stroke-dasharray:2,3; stroke-width:1; }
.fs-zero-line{ stroke:var(--text-dimmer); stroke-dasharray:3,2; stroke-width:1; }
.fs-axis-label{ fill:var(--text-dimmer); font-size:9.5px; }
.fs-bar-rect{ transition:opacity 120ms; }
.fs-bar-rect.clickable{ cursor:pointer; }
.fs-bar-rect.clickable:hover{ opacity:0.75; }
.fs-line-path{ fill:none; stroke-width:2; }
.fs-chart-point{ transition:r 120ms; }
.fs-chart-point.clickable{ cursor:pointer; }
.fs-chart-point.clickable:hover{ r:5.5; }

.fs-legend-row{ display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; }
.fs-legend-item{ display:flex; align-items:center; gap:5px; font-size:12px; color:var(--text-dim); }
.fs-legend-swatch{ width:8px; height:8px; border-radius:1px; flex-shrink:0; }
.fs-legend-value{ color:var(--text); font-weight:600; }

/* "why this chart" log — a standing per-chart self-declaration, not a
   tutorial: it never suggests the next question to ask, it only states
   what THIS chart, here, answers and why this evidence justifies it. */
.why-toggle{
  display:inline-flex; align-items:center; gap:6px; margin:9px 0 4px;
  background:none; border:none; padding:0; cursor:pointer; font-size:11px; color:var(--text-dimmer);
}
.why-toggle:hover{ color:var(--hover); }
.why-toggle .why-glyph{
  width:13px; height:13px; border-radius:50%; border:1px solid currentColor;
  display:flex; align-items:center; justify-content:center; font-size:9px; flex:0 0 auto;
}
.why-note{ display:grid; grid-template-rows:0fr; transition:grid-template-rows 220ms ease; }
.why-note.open{ grid-template-rows:1fr; }
.why-note > div{ overflow:hidden; }
.why-note-inner{
  font-size:11.5px; line-height:1.55; color:var(--text-dim);
  border-left:2px solid var(--border); padding:2px 0 8px 10px; margin-top:2px;
}
.why-note-inner .why-q{ color:var(--text); }

.fs-prose{ font-size:13.5px; line-height:1.65; color:var(--text-dim); max-width:72ch; }
.fs-prose p{ margin:0 0 10px; }
.fs-prose p:last-child{ margin-bottom:0; }
.fs-prose-unavailable{ font-size:12.5px; color:var(--text-dimmer); font-style:italic; }

.derivation{
  margin-top:2px; margin-bottom:24px; padding:11px 13px; background:var(--panel-bg);
  border:1px solid var(--border); font-size:13px; color:var(--text-dim); max-width:640px;
}
.derivation b{ color:var(--text); }

.data-table{ width:100%; max-width:640px; border-collapse:collapse; margin-top:4px; font-size:12.5px; }
.data-table th, .data-table td{ border:1px solid var(--border); padding:7px 11px; text-align:left; }
.data-table th{ color:var(--text-dimmer); font-weight:600; background:var(--panel-bg); font-size:11.5px; text-transform:uppercase; letter-spacing:0.3px; }
.data-table td{ color:var(--text-dim); }

/* scrollbars, kept subtle */
.fs-overlay::-webkit-scrollbar{ width:9px; }
.fs-overlay::-webkit-scrollbar-thumb{ background:var(--border); border-radius:5px; }
.fs-overlay::-webkit-scrollbar-track{ background:transparent; }
</style>

<script>

          { id:"electronics_export", resource:"Electronics", origin:"Kepler", destination:"Faros-YelenKalen International", breadcrumbLabel:"Kepler → Faros-YelenKalen International",
            volume:54, unit:"units/qtr", status:"running", history:[38,44,49,54] }

        headlineColor: "green",

          { id:"coal_mine", name:"Coal Mine", body:"Kepler", staffed_pct:91, wage_tier:"Standard", history:[85,88,90,91] },
          { id:"steel_mill", name:"Steel Mill", body:"Kepler", staffed_pct:79, wage_tier:"Skilled", history:[70,74,77,79] },
          { id:"electronics_plant", name:"Electronics Plant", body:"Selene", staffed_pct:74, wage_tier:"Skilled", history:[60,66,70,74] }

        explainer: "A labour shortage on Kepler and Selene has pulled staffing down across the board this quarter. The Electronics Plant fell below the 50% floor and idled automatically; the Steel Mill is trending the same way. Wage-tier gaps have opened on both Skilled-tier buildings — raising wages there is the fastest lever back to full staffing.",

          { id:"iron_mine", name:"Iron Mine", body:"Kepler", staffed_pct:74, wage_tier:"Standard", history:[82,80,78,74] },

        revenue:6980, inputs:2650, wages:3120, maintenance:1350, net:-140,

        note: "Revenue dropped sharply this quarter while spend rose — the first loss-making quarter in the last eight."
      }
    }
  };

  var WHY = {
    production_main: { question:"Which buildings are producing, and how much, this quarter?",
      why:"A bar per building is the fastest way to spot an idle producer without opening each building's own panel." },
    trade_main: { question:"Which trade routes are moving goods, and at what volume, this quarter?",
      why:"Route volume side-by-side surfaces a suspended or shrinking route at a glance, before it shows up in the balance." },
    workforce_main: { question:"How fully staffed is each building relative to its idle floor?",
      why:"Staffing drives output and wage cost directly, so a per-building bar flags the building about to idle before it does." },
    finance_main: { question:"Is the corporation earning or losing money quarter over quarter, and by how much?",
      why:"A revenue-vs-spend line makes the trend visible, not just this quarter's single number." },
    production_drill: { question:"How has this building's output moved over recent quarters?",
      why:"A single-building trend distinguishes a one-quarter dip from a sustained decline." },
    trade_drill: { question:"How has this route's volume moved over recent quarters, and is it still running?",
      why:"Route-level history separates a seasonal dip from a route the player actually suspended." },
    workforce_drill: { question:"How has this building's staffing trended into its current state?",
      why:"Seeing the slide toward the idle floor explains why a building went idle, not just that it did." },
    finance_drill: { question:"What does the corporation's income trend look like over a longer window?",
      why:"A single quarter's net figure can't show whether a loss is a shock or the end of a slide." }
  };

  // -------------------------------------------------------------
  // Formatting helpers
  // -------------------------------------------------------------
  function fmtNum(n){ return Math.round(n).toLocaleString("en-US"); }
  function crAbs(n){ return "Cr " + Math.round(Math.abs(n)).toLocaleString("en-US"); }
  function crSigned(n){
    var sign = n >= 0 ? "+" : "−";
    return sign + Math.abs(Math.round(n)).toLocaleString("en-US") + " Cr/qtr";
  }
  function workforceColor(pct){
    if(pct >= 75) return COLORS.green;
    if(pct >= 50) return COLORS.amber;
    return COLORS.red;
  }

  // -------------------------------------------------------------
  // Chart SVG generation — full-screen scale versions
  // -------------------------------------------------------------
  function svgBar(items, opts){
    opts = opts || {};
    var w=560, h=190, chartH=h-36;
    var max = Math.max.apply(null, items.map(function(it){ return it.value; })) * 1.2 || 1;
    var step = w / items.length;
    var bw = step * 0.5;
    var grid = "";
    [0.25,0.5,0.75,1].forEach(function(f){
      var y = chartH - chartH*f;
      grid += '<line x1="0" y1="'+y.toFixed(1)+'" x2="'+w+'" y2="'+y.toFixed(1)+'" class="fs-gridline"/>';
    });
    var rects = "", labels = "";
    items.forEach(function(it,i){
      var bh = (it.value/max) * chartH;
      var x = step*i + (step-bw)/2;
      var y = chartH - bh;
      var cls = "fs-bar-rect" + (opts.clickable ? " clickable" : "");
      rects += '<rect class="'+cls+'" data-subject="'+it.id+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(bh,1).toFixed(1)+'" fill="'+it.color+'" rx="2"></rect>';
      labels += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h-13)+'" class="fs-axis-label" text-anchor="middle">'+it.label+'</text>';
    });
    return '<svg viewBox="0 0 '+w+' '+h+'" class="fs-chart-svg">'+grid+rects+labels+'</svg>';
  }

  function svgLine(quarters, series, opts){
    opts = opts || {};
    var w=560, h=190, chartH=h-36;
    var allVals = [];
    series.forEach(function(s){ s.values.forEach(function(v){ allVals.push(v); }); });
    var lo = Math.min.apply(null, allVals);
    var hi = Math.max.apply(null, allVals);
    if(lo > 0) lo = 0;
    var pad = (hi-lo)*0.12 || 1;
    hi += pad;
    var range = (hi-lo) || 1;
    var step = w / (quarters.length - 1);
    function yOf(v){ return chartH - ((v-lo)/range) * chartH; }

    var grid = "";
    [0,0.25,0.5,0.75,1].forEach(function(f){
      var y = chartH - chartH*f;
      grid += '<line x1="0" y1="'+y.toFixed(1)+'" x2="'+w+'" y2="'+y.toFixed(1)+'" class="fs-gridline"/>';
    });
    var zeroLine = "";
    if(lo < 0){
      var zy = yOf(0).toFixed(1);
      zeroLine = '<line x1="0" y1="'+zy+'" x2="'+w+'" y2="'+zy+'" class="fs-zero-line"></line>';
    }

    var lines = "", points = "";
    series.forEach(function(s){
      var pts = s.values.map(function(v,i){ return (step*i).toFixed(1)+","+yOf(v).toFixed(1); }).join(" ");
      lines += '<polyline points="'+pts+'" class="fs-line-path" stroke="'+s.color+'"></polyline>';
      s.values.forEach(function(v,i){
        var cls = "fs-chart-point" + (opts.clickable ? " clickable" : "");
        points += '<circle class="'+cls+'" data-subject="'+(opts.subjectId||"")+'" cx="'+(step*i).toFixed(1)+'" cy="'+yOf(v).toFixed(1)+'" r="3.5" fill="'+s.color+'"></circle>';
      });
    });

    var labels = quarters.map(function(q,i){
      return '<text x="'+(step*i).toFixed(1)+'" y="'+(h-13)+'" class="fs-axis-label" text-anchor="middle">'+q+'</text>';
    }).join("");

    return '<svg viewBox="0 0 '+w+' '+h+'" class="fs-chart-svg">'+grid+zeroLine+lines+points+labels+'</svg>';
  }

  function legendRowBar(items){
    var parts = items.map(function(it){
      return '<span class="fs-legend-item"><span class="fs-legend-swatch" style="background:'+it.color+'"></span>'
        + it.label + ' <span class="fs-legend-value">' + it.displayValue + '</span></span>';
    }).join("");
    return '<div class="fs-legend-row">'+parts+'</div>';
  }

  function legendRowLine(series, opts){
    opts = opts || {};
    var fmt = opts.fmt || function(v){ return fmtNum(v); };
    var parts = series.map(function(s){
      var last = s.values[s.values.length-1];
      return '<span class="fs-legend-item"><span class="fs-legend-swatch" style="background:'+s.color+'"></span>'
        + s.label + ' <span class="fs-legend-value">' + fmt(last) + ' (latest)</span></span>';
    }).join("");
    return '<div class="fs-legend-row">'+parts+'</div>';
  }

  /* "why this chart" log */
  var whyCounter = 0;
  function whyBlockHTML(question, why){
    whyCounter++;
    var id = "why-" + whyCounter;
    return ""
      + '<button class="why-toggle" data-why-target="'+id+'"><span class="why-glyph">?</span> Why this chart</button>'
      + '<div class="why-note" id="'+id+'"><div><div class="why-note-inner">'
      +   '<div class="why-q"><b>Answers:</b> '+question+'</div>'
      +   '<div><b>Because:</b> '+why+'</div>'
      + '</div></div></div>';
  }
  function wireWhyToggles(root){
    root.querySelectorAll(".why-toggle").forEach(function(btn){
      btn.addEventListener("click", function(){
        var note = document.getElementById(btn.getAttribute("data-why-target"));
        note.classList.toggle("open");
      });
    });
  }

  // -------------------------------------------------------------
  // Per-card body builders — main (roll-up) and drill (subject) views
  // -------------------------------------------------------------
  function findById(list, id){
    for(var i=0;i<list.length;i++){ if(list[i].id === id) return list[i]; }
    return null;
  }

  function verdictHTML(colorKey, text, clickableSubject){
    var color = COLORS[colorKey];
    var cls = "fs-verdict" + (clickableSubject ? " clickable" : "");
    var attr = clickableSubject ? ' data-subject="'+clickableSubject+'"' : "";
    return '<div class="'+cls+'"'+attr+' style="color:'+color+'"><span class="glyph" style="background:'+color+'"></span><span>'+text+'</span></div>';
  }

  function productionMainHTML(d){
    var items = d.buildings.map(function(b){
      return { id:b.id, label:b.name, value:b.output, displayValue: fmtNum(b.output)+" "+b.unit,
        color: b.status==="producing" ? COLORS.green : COLORS.red };
    });
    return verdictHTML(d.headlineColor, d.headline)
      + '<div class="fs-sub">'+SCENARIO_LABEL[currentScenario()]+'</div>'
      + '<div class="fs-chart-block">'
      +   svgBar(items, {clickable:true})
      +   legendRowBar(items)
      +   whyBlockHTML(WHY.production_main.question, WHY.production_main.why)
      + '</div>';
  }

  function productionDrillHTML(d, subjectId){
    var b = findById(d.buildings, subjectId);
    if(!b) return '<div class="fs-prose-unavailable">Unknown building.</div>';
    var color = b.status==="producing" ? COLORS.green : COLORS.red;
    var note = b.status==="producing"
      ? "Producing normally this quarter."
      : "Idle — understaffed. Needs staffing above the 50% floor to resume.";
    return verdictHTML(b.status==="producing" ? "green" : "red", b.name+" — "+fmtNum(b.output)+" "+b.unit)
      + '<div class="fs-sub">'+b.body+' &middot; '+(b.status==="producing" ? "Producing" : "Idle")+'</div>'
      + '<div class="fs-chart-block">'
      +   svgLine(QUARTERS4[currentScenario()], [{label:b.name, color:color, values:b.history}], {})
      +   legendRowLine([{label:b.name, color:color, values:b.history}], {fmt:function(v){ return fmtNum(v)+" "+b.unit; }})
      +   whyBlockHTML(WHY.production_drill.question, WHY.production_drill.why)
      + '</div>'
      + '<div class="fs-prose"><p><b>Recipe:</b> '+b.recipe+'</p><p><b>Status:</b> '+note+'</p></div>';
  }

  function tradeMainHTML(d){
    var items = d.routes.map(function(r){
      return { id:r.id, label:r.resource, value:r.volume, displayValue: fmtNum(r.volume)+" "+r.unit,
        color: r.status==="running" ? COLORS.green : COLORS.red };
    });
    return verdictHTML(d.headlineColor, d.headline)
      + '<div class="fs-sub">'+SCENARIO_LABEL[currentScenario()]+'</div>'
      + '<div class="fs-chart-block">'
      +   svgBar(items, {clickable:true})
      +   legendRowBar(items)
      +   whyBlockHTML(WHY.trade_main.question, WHY.trade_main.why)
      + '</div>';
  }

  function tradeDrillHTML(d, subjectId){
    var r = findById(d.routes, subjectId);
    if(!r) return '<div class="fs-prose-unavailable">Unknown route.</div>';
    var color = r.status==="running" ? COLORS.green : COLORS.red;
    var note = r.status==="running"
      ? "Route running normally this quarter."
      : "Suspended — no shipments moved this quarter.";
    return verdictHTML(r.status==="running" ? "green" : "red", r.resource+" — "+fmtNum(r.volume)+" "+r.unit)
      + '<div class="fs-sub">'+r.breadcrumbLabel+' &middot; '+(r.status==="running" ? "Running" : "Suspended")+'</div>'
      + '<div class="fs-chart-block">'
      +   svgLine(QUARTERS4[currentScenario()], [{label:r.resource, color:color, values:r.history}], {})
      +   legendRowLine([{label:r.resource, color:color, values:r.history}], {fmt:function(v){ return fmtNum(v)+" "+r.unit; }})
      +   whyBlockHTML(WHY.trade_drill.question, WHY.trade_drill.why)
      + '</div>'
      + '<div class="fs-prose"><p><b>Partner:</b> '+r.destination+'</p><p><b>Status:</b> '+note+'</p></div>';
  }

  function workforceMainHTML(d){
    var items = d.buildings.map(function(b){
      return { id:b.id, label:b.name, value:b.staffed_pct, displayValue: b.staffed_pct+"%", color: workforceColor(b.staffed_pct) };
    });
    var rows = d.buildings.map(function(b){
      return '<tr><td>'+b.name+'</td><td>'+b.body+'</td><td>'+b.staffed_pct+'%</td><td>'+b.wage_tier+'</td></tr>';
    }).join("");
    return verdictHTML(d.headlineColor, d.headline)
      + '<div class="fs-sub">'+SCENARIO_LABEL[currentScenario()]+'</div>'
      + '<div class="fs-chart-block">'
      +   svgBar(items, {clickable:true})
      +   legendRowBar(items)
      +   whyBlockHTML(WHY.workforce_main.question, WHY.workforce_main.why)
      + '</div>'
      + '<div class="fs-prose"><p>'+d.explainer+'</p></div>'
      + '<table class="data-table"><thead><tr><th>Building</th><th>Body</th><th>Staffed %</th><th>Wage tier</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }

  function workforceDrillHTML(d, subjectId){
    var b = findById(d.buildings, subjectId);
    if(!b) return '<div class="fs-prose-unavailable">Unknown building.</div>';
    var color = workforceColor(b.staffed_pct);
    var note = b.staffed_pct < 50
      ? "Below the 50% floor — this building idles automatically until staffing recovers."
      : (b.staffed_pct < 75 ? "Trending toward the floor — worth a wage-tier review." : "Comfortably staffed, no action needed.");
    var colorKey = b.staffed_pct >= 75 ? "green" : (b.staffed_pct >= 50 ? "amber" : "red");
    return verdictHTML(colorKey, b.name+" — "+b.staffed_pct+"% staffed")
      + '<div class="fs-sub">'+b.body+' &middot; '+b.wage_tier+' wage tier</div>'
      + '<div class="fs-chart-block">'
      +   svgLine(QUARTERS4[currentScenario()], [{label:b.name, color:color, values:b.history}], {})
      +   legendRowLine([{label:b.name, color:color, values:b.history}], {fmt:function(v){ return v+"%"; }})
      +   whyBlockHTML(WHY.workforce_drill.question, WHY.workforce_drill.why)
      + '</div>'
      + '<div class="fs-prose"><p><b>Status:</b> '+note+'</p></div>';
  }

  function financeMainHTML(d){
    var series = [
      { label:"Revenue", color:COLORS.green, values:d.revenue4 },
      { label:"Spend", color:COLORS.red, values:d.spend4 }
    ];
    return verdictHTML(d.headlineColor, d.headline, "income_history")
      + '<div class="fs-sub">'+SCENARIO_LABEL[currentScenario()]+'</div>'
      + '<div class="fs-chart-block">'
      +   svgLine(QUARTERS4[currentScenario()], series, {clickable:true, subjectId:"income_history"})
      +   legendRowLine(series, {fmt:function(v){ return crAbs(v); }})
      +   whyBlockHTML(WHY.finance_main.question, WHY.finance_main.why)
      + '</div>'
      + '<div class="derivation">Revenue '+crAbs(d.revenue)+' − Inputs '+crAbs(d.inputs)+' − Wages '+crAbs(d.wages)+' − Maintenance '+crAbs(d.maintenance)+' = <b>Net '+crSigned(d.net)+'</b></div>';
  }

  function financeDrillHTML(d){
    var series = [
      { label:"Revenue", color:COLORS.green, values:d.revenue8 },
      { label:"Spend", color:COLORS.red, values:d.spend8 }
    ];
    return verdictHTML(d.headlineColor, d.headline)
      + '<div class="fs-sub">Income history — 8 quarters</div>'
      + '<div class="fs-chart-block">'
      +   svgLine(QUARTERS8[currentScenario()], series, {})
      +   legendRowLine(series, {fmt:function(v){ return crAbs(v); }})
      +   whyBlockHTML(WHY.finance_drill.question, WHY.finance_drill.why)
      + '</div>'
      + '<div class="fs-prose"><p>'+d.note+'</p></div>';
  }

  function subjectLabel(cardId, drillId){
    var d = DATA[currentScenario()][cardId];
    if(cardId==="production" || cardId==="workforce"){
      var b = findById(d.buildings, drillId);
      return b ? b.name : drillId;
    }
    if(cardId==="trade"){
      var r = findById(d.routes, drillId);
      return r ? r.breadcrumbLabel : drillId;
    }
    if(cardId==="finance"){ return "Income history"; }
    return drillId;
  }

  // -------------------------------------------------------------
  // State + wiring
  // -------------------------------------------------------------
  var STATE = { scenario:"q2" };
  function currentScenario(){ return STATE.scenario; }

  var fsState = { cardId:null, drillId:null };

  var dashboardEl = document.getElementById("dashboard");
  var simTimeEl = document.getElementById("simTime");
  var scenarioSwitchEl = document.getElementById("scenarioSwitch");
  var fsOverlay = document.getElementById("fsOverlay");
  var fsHeader = document.getElementById("fsHeader");
  var fsBody = document.getElementById("fsBody");

  function cardRowHTML(cardId){
    var d = DATA[currentScenario()][cardId];
    var color = COLORS[d.headlineColor];
    return '<article class="card" data-card-id="'+cardId+'">'
      +   '<div class="card-row">'
      +     '<span class="card-title">'+CARD_TITLES[cardId]+'</span>'
      +     '<span class="card-verdict" style="color:'+color+'">'+d.headline+'</span>'
      +     '<button class="go-to-btn" title="Go to on map — not wired in this mock">[&rsaquo;]</button>'
      +     '<button class="fold-chevron-btn" title="Expand to full screen">&#9662;</button>'
      +   '</div>'
      + '</article>';
  }

  function renderDashboard(){
    dashboardEl.innerHTML = CARD_ORDER.map(cardRowHTML).join("");
  }

  function renderTopbar(){
    simTimeEl.textContent = SIM_TIME[currentScenario()];
    scenarioSwitchEl.innerHTML = SCENARIO_KEYS.map(function(k){
      return '<button class="'+(currentScenario()===k ? "active" : "")+'" data-scenario="'+k+'">'+SCENARIO_LABEL[k]+'</button>';
    }).join("");
  }

  dashboardEl.addEventListener("click", function(e){
    if(e.target.closest(".go-to-btn")) return;
    var card = e.target.closest(".card");
    if(card) openCard(card.getAttribute("data-card-id"));
  });

  scenarioSwitchEl.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-scenario]");
    if(!btn) return;
    setScenario(btn.getAttribute("data-scenario"));
  });

  function setScenario(key){
    if(STATE.scenario === key) return;
    STATE.scenario = key;
    fsState.drillId = null; // closes any open drill — see NOTES.md judgment calls
    renderTopbar();
    renderDashboard();
    if(fsState.cardId) renderFs(); // fold state (which card, if any, is full-screen) survives untouched
  }

  function openCard(cardId){
    fsState.cardId = cardId;
    fsState.drillId = null;
    fsOverlay.hidden = false;
    requestAnimationFrame(function(){ fsOverlay.classList.add("open"); });
    renderFs();
  }
  function closeFs(){
    fsOverlay.classList.remove("open");
    fsState.cardId = null;
    fsState.drillId = null;
    setTimeout(function(){ fsOverlay.hidden = true; }, 200);
  }
  function closeDrill(){
    fsState.drillId = null;
    renderFs();
  }
  function drillTo(subjectId){
    fsState.drillId = subjectId;
    renderFs();
  }

  function renderFs(){
    var cardId = fsState.cardId;
    if(!cardId) return;
    renderFsHeader(cardId);
    renderFsBody(cardId);
  }

  function renderFsHeader(cardId){
    var title = CARD_TITLES[cardId];
    var drillId = fsState.drillId;
    var crumbHtml = '<div class="fs-breadcrumb">'
      + (drillId ? '<button class="fs-back-btn" id="fsBackBtn" title="Back">&#8249;</button>' : "")
      + '<span class="crumb-seg" data-crumb="root">Genom Systems</span>'
      + '<span class="crumb-sep">&rsaquo;</span>'
      + (drillId
          ? '<span class="crumb-seg" data-crumb="card">'+title+'</span><span class="crumb-sep">&rsaquo;</span><span class="crumb-seg current">'+subjectLabel(cardId, drillId)+'</span>'
          : '<span class="crumb-seg current">'+title+'</span>')
      + '</div>';
    fsHeader.innerHTML = crumbHtml
      + '<div class="fs-header-controls"><button class="fs-fold-btn" id="fsFoldBtn">&#9652; Fold up</button></div>';

    fsHeader.querySelector("#fsFoldBtn").addEventListener("click", closeFs);
    fsHeader.querySelector('[data-crumb="root"]').addEventListener("click", closeFs);
    var cardCrumb = fsHeader.querySelector('[data-crumb="card"]');
    if(cardCrumb) cardCrumb.addEventListener("click", closeDrill);
    var backBtn = fsHeader.querySelector("#fsBackBtn");
    if(backBtn) backBtn.addEventListener("click", closeDrill);
  }

  function renderFsBody(cardId){
    var d = DATA[currentScenario()][cardId];
    var drillId = fsState.drillId;
    var html = "";
    if(cardId === "production") html = drillId ? productionDrillHTML(d, drillId) : productionMainHTML(d);
    else if(cardId === "trade") html = drillId ? tradeDrillHTML(d, drillId) : tradeMainHTML(d);
    else if(cardId === "workforce") html = drillId ? workforceDrillHTML(d, drillId) : workforceMainHTML(d);
    else if(cardId === "finance") html = drillId ? financeDrillHTML(d) : financeMainHTML(d);
    fsBody.innerHTML = html;
    wireFsBody();
  }

  function wireFsBody(){
    fsBody.querySelectorAll(".clickable[data-subject]").forEach(function(el){
      el.addEventListener("click", function(){ drillTo(el.getAttribute("data-subject")); });
    });
    wireWhyToggles(fsBody);
  }

  // -------------------------------------------------------------
  // Boot
  // -------------------------------------------------------------
  renderTopbar();
  renderDashboard();
})();
</script>
