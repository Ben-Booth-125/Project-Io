<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Project Io — Selection Band Exemplar</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#05070b;
    --panel:#0c1018;
    --panel-2:#0e131c;
    --border:#2a3140;
    --border-soft:#1c2230;
    --text:#d6dae2;
    --text-dim:#aeb3bd;
    --text-mute:#8c92a0;
    --green:#6EC878;
    --red:#D86460;
    --grey:#AAAFB9;
    --white:#ffffff;
    --hover:#78BEFF;
    --amber:#FFC85A;
    --accent:#3D84E0;
    --dock-h: 300px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
    font-size:13px;
    overflow-x:hidden;
  }

  /* ---------- background canvas (flavor only, non-interactive) ---------- */
  .bg-canvas{
    position:fixed; inset:0; z-index:0;
    background-color:var(--bg);
    background-image:
      linear-gradient(135deg, rgba(255,255,255,0.025) 25%, transparent 25%),
      linear-gradient(225deg, rgba(255,255,255,0.025) 25%, transparent 25%),
      linear-gradient(45deg, rgba(255,255,255,0.018) 25%, transparent 25%),
      linear-gradient(315deg, rgba(255,255,255,0.018) 25%, transparent 25%);
    background-position: 22px 0, 22px 0, 0 0, 0 0;
    background-size: 44px 44px;
  }
  .bg-label{
    position:fixed; top:18px; left:24px; z-index:1;
    color:var(--text-mute); letter-spacing:.04em;
    font-size:11px; text-transform:uppercase; opacity:.55;
    pointer-events:none;
  }
  .bg-label b{ color:var(--text-dim); font-weight:600; }
  .bg-crumbs-hint{
    position:fixed; top:18px; right:24px; z-index:1;
    color:var(--text-mute); font-size:11px; opacity:.5;
    pointer-events:none;
  }

  /* ---------- dock band ---------- */
  .dock{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    height:var(--dock-h);
    background:var(--panel);
    border-top:1px solid var(--border);
    display:flex;
    box-shadow: 0 -8px 24px rgba(0,0,0,.35);
  }
  .col{
    height:100%;
    padding:12px 16px;
    display:flex; flex-direction:column;
    min-width:0;
  }
  .col + .col{ border-left:1px solid var(--border-soft); }
  .col-hex{ flex: 0 0 30%; }
  .col-metric{ flex: 1 1 40%; }
  .col-actions{ flex: 0 0 26%; }

  .col-title{
    font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--text-mute); margin-bottom:8px;
  }

  /* ---------- left: hex grid ---------- */
  .hex-wrap{
    flex:1; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--border-soft); border-radius:2px;
    background:var(--panel-2);
  }
  .hex-wrap svg{ width:100%; height:100%; max-height:200px; }
  .hex-cell{
    fill:#141a26; stroke:var(--border); stroke-width:1.5;
    cursor:pointer; transition: fill 120ms ease, stroke 120ms ease;
  }
  .hex-cell:hover{ stroke:var(--hover); }
  .hex-cell.selected{ fill:#1c2b1f; stroke:var(--green); stroke-width:2.5; }
  .hex-label{
    font-size:8.5px; fill:var(--text-mute); text-anchor:middle;
    pointer-events:none; user-select:none;
  }
  .hex-label.selected-label{ fill:var(--green); font-weight:600; }
  .tile-id-line{
    margin-top:8px; font-size:11px; color:var(--text-dim);
    text-align:center;
  }
  .tile-id-line b{ color:var(--text); }

  /* ---------- middle: metric card (folded, resting state) ---------- */
  .metric-card{
    flex:1; display:flex; flex-direction:column; min-height:0;
  }
  .card-header{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-bottom:10px; min-height:24px;
  }
  .pager{
    display:flex; align-items:center; gap:8px;
    font-size:13px; color:var(--text);
  }
  .pager button{
    background:none; border:1px solid var(--border-soft); color:var(--text-dim);
    width:20px; height:20px; border-radius:2px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:11px;
    line-height:1;
  }
  .pager button:hover{ border-color:var(--hover); color:var(--hover); }
  .pager .pager-label{ min-width:150px; text-align:center; }
  .pager .pager-label b{ color:var(--text); font-weight:600; }
  .pager .pager-count{ color:var(--text-mute); font-size:11.5px; }

  .header-controls{ display:flex; align-items:center; gap:10px; }

  /* fold chevron — the whole depth control now: two positions only */
  .fold-btn{
    appearance:none; background:none; border:1px solid var(--border-soft);
    color:var(--text-dim); width:22px; height:20px; border-radius:2px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:11px; line-height:1; transition: border-color 120ms ease, color 120ms ease;
  }
  .fold-btn:hover{ border-color:var(--hover); color:var(--hover); }

  .goto-btn{
    background:none; border:1px solid var(--border-soft); color:var(--text-mute);
    width:20px; height:20px; border-radius:2px; cursor:default;
    display:flex; align-items:center; justify-content:center; font-size:11px;
    opacity:.55;
  }

  /* folded card body: a single clickable row, nothing else */
  .card-body{ flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; }
  .fold-row{
    display:flex; align-items:center; gap:9px; cursor:pointer;
    padding:6px 4px; border-radius:2px; transition: background 120ms ease;
  }
  .fold-row:hover{ background:rgba(255,255,255,0.03); }
  .fold-row .fold-chevron{ color:var(--text-mute); font-size:11px; flex:0 0 auto; }
  .fold-row:hover .fold-chevron{ color:var(--hover); }
  .glance-line{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    font-size:13.5px; color:var(--text); min-width:0;
  }
  .pip{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .pip.ok{ background:var(--green); }
  .pip.warn{ background:var(--amber); }
  .pip.bad{ background:var(--red); }
  .glance-sub{ color:var(--text-mute); font-size:11.5px; margin-top:3px; padding-left:21px; }
  .fold-hint{ font-size:10px; color:var(--text-mute); opacity:.55; margin-top:10px; padding-left:21px; }

  /* ---------- full-screen expanded view (level 2: everything, at once) ---------- */
  .fs-overlay{
    position:fixed; inset:0; z-index:50;
    background:var(--bg);
    opacity:0; pointer-events:none;
    transition: opacity 200ms ease;
    overflow-y:auto;
  }
  .fs-overlay.open{ opacity:1; pointer-events:auto; }
  .fs-inner{
    width:min(880px, calc(100% - 96px));
    margin: 56px auto 64px;
  }
  .fs-header{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding-bottom:16px; margin-bottom:24px;
    border-bottom:1px solid var(--border);
  }
  .fs-pager{ display:flex; align-items:center; gap:10px; font-size:18px; color:var(--text); }
  .fs-pager button{
    background:none; border:1px solid var(--border-soft); color:var(--text-dim);
    width:26px; height:26px; border-radius:2px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:13px;
  }
  .fs-pager button:hover{ border-color:var(--hover); color:var(--hover); }
  .fs-pager .fs-pager-count{ color:var(--text-mute); font-size:12.5px; font-weight:400; }
  .fs-breadcrumb{
    display:flex; align-items:center; gap:7px; flex-wrap:wrap;
    font-size:15px; color:var(--text-mute);
  }
  .fs-breadcrumb .crumb{ cursor:pointer; }
  .fs-breadcrumb .crumb:hover{ color:var(--hover); text-decoration:underline; }
  .fs-breadcrumb .crumb.current{ color:var(--text); cursor:default; text-decoration:none; font-weight:600; }
  .fs-breadcrumb .crumb-sep{ opacity:.5; }
  .fs-header-controls{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
  .fs-fold-btn{
    appearance:none; background:none; border:1px solid var(--border-soft);
    color:var(--text-dim); padding:5px 10px; border-radius:2px; cursor:pointer;
    display:flex; align-items:center; gap:6px; font-size:12px;
  }
  .fs-fold-btn:hover{ border-color:var(--hover); color:var(--hover); }
  .fs-back-btn{
    background:none; border:1px solid var(--border-soft); color:var(--text-dim);
    width:24px; height:24px; border-radius:2px; cursor:pointer; font-size:14px;
  }
  .fs-back-btn:hover{ border-color:var(--hover); color:var(--hover); }

  .fs-glance-line{
    display:flex; align-items:center; gap:10px;
    font-size:20px; color:var(--text); margin-bottom:4px;
  }
  .fs-glance-line .pip{ width:11px; height:11px; }
  .fs-glance-sub{ color:var(--text-mute); font-size:13px; margin-bottom:26px; }

  .fs-legend-row{ display:flex; gap:24px; margin-bottom:14px; font-size:13px; }
  .fs-legend-item{ display:flex; align-items:center; gap:7px; color:var(--text-dim); }
  .fs-legend-swatch{ width:11px; height:11px; border-radius:2px; flex:0 0 auto; }
  .fs-legend-item .lv{ color:var(--text); font-weight:600; margin-left:2px; }

  .fs-chart{
    position:relative; height:220px; display:flex; align-items:flex-end;
    gap:64px; padding:0 12px; border-bottom:1px solid var(--border-soft);
    margin-bottom:16px;
  }
  .fs-gridline{
    position:absolute; left:0; right:0; border-top:1px dotted var(--border-soft);
    pointer-events:none;
  }
  .fs-threshold-line{
    position:absolute; left:0; right:0; border-top:1px dashed var(--grey);
    pointer-events:none; opacity:.65;
  }
  .fs-bar-col{
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    width:88px; height:100%; position:relative;
  }
  .fs-bar-value{ font-size:14px; color:var(--text-dim); margin-bottom:6px; }
  .fs-bar{
    width:56px; border-radius:3px 3px 0 0; cursor:pointer;
    transition: filter 120ms ease, transform 120ms ease;
  }
  .fs-bar:hover{ filter:brightness(1.2); transform:translateY(-1px); }
  .fs-bar.this-tile{ background:var(--green); }
  .fs-bar.top-decile{ background:var(--grey); }
  .fs-bar-label{ font-size:12.5px; color:var(--text-mute); margin-top:8px; }
  .fs-bar-hint{ font-size:10.5px; color:var(--text-mute); opacity:.6; margin-top:1px; }

  .fs-derivation{
    font-size:13px; color:var(--text-dim); line-height:1.6; max-width:60ch;
  }
  .fs-derivation b{ color:var(--text); font-weight:600; }
  .fs-derivation-tag{
    display:inline-block; margin-top:8px; font-size:11.5px; color:var(--text-mute);
    border:1px solid var(--border-soft); border-radius:2px; padding:3px 8px;
  }

  /* "why this chart" log — not a tutorial, a standing self-declaration every
     chart carries: the question it answers and why this evidence answers it.
     Closed by default; a small affordance, not inline prose. */
  .why-toggle{
    display:inline-flex; align-items:center; gap:6px; margin:2px 0 12px;
    background:none; border:none; padding:0; cursor:pointer;
    font-size:11.5px; color:var(--text-mute);
  }
  .why-toggle:hover{ color:var(--hover); }
  .why-toggle .why-glyph{
    width:14px; height:14px; border-radius:50%; border:1px solid currentColor;
    display:flex; align-items:center; justify-content:center; font-size:9.5px;
    flex:0 0 auto;
  }
  .why-note{
    display:grid; grid-template-rows:0fr; transition:grid-template-rows 220ms ease;
    max-width:60ch; margin-bottom:4px;
  }
  .why-note.open{ grid-template-rows:1fr; }
  .why-note > div{ overflow:hidden; }
  .why-note-inner{
    font-size:12px; line-height:1.55; color:var(--text-dim);
    border-left:2px solid var(--border-soft); padding:2px 0 12px 10px; margin-top:2px;
  }
  .why-note-inner b{ color:var(--text-dim); font-weight:600; }
  .why-note-inner .why-q{ color:var(--text); }

  .fs-drill-hint{ font-size:12px; color:var(--text-mute); margin-bottom:10px; }
  .fs-line-chart-wrap svg{ width:100%; height:220px; overflow:visible; }
  .fs-lc-grid{ stroke:var(--border-soft); stroke-width:1; stroke-dasharray:1 3; }
  .fs-lc-line{ fill:none; stroke:var(--green); stroke-width:2.2; }
  .fs-lc-area{ fill:url(#lcGrad); opacity:.5; }
  .fs-lc-dot{ fill:var(--green); }
  .fs-lc-dot.current{ fill:var(--white); }
  .fs-lc-axis-label{ font-size:11px; fill:var(--text-mute); }
  .fs-drill-stats{ display:flex; gap:32px; margin-top:22px; font-size:13px; }
  .fs-drill-stat b{ display:block; color:var(--text); font-size:19px; margin-top:3px; }
  .fs-drill-stat span{ color:var(--text-mute); }

  .fs-stat-note{ font-size:14px; color:var(--text-dim); line-height:1.6; max-width:60ch; }

  /* ---------- right: action grid ---------- */
  .action-grid{
    flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr 1fr;
    gap:8px;
  }
  .action-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:5px; background:var(--panel-2); border:1px solid var(--border-soft);
    border-radius:2px; color:var(--text-dim); cursor:pointer; font-size:11px;
    transition: border-color 120ms ease, color 120ms ease, background 120ms ease;
  }
  .action-btn:hover{ border-color:var(--hover); color:var(--hover); background:#101724; }
  .action-btn svg{ width:18px; height:18px; }
  .action-btn.placeholder{
    color:var(--text-mute); opacity:.35; cursor:default;
  }
  .action-btn.placeholder:hover{ border-color:var(--border-soft); color:var(--text-mute); background:var(--panel-2); }

  /* scrollbar tidy */
  .fs-overlay::-webkit-scrollbar{ width:8px; }
  .fs-overlay::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
</style>
</head>
<body>

  <div class="bg-canvas"></div>
  <div class="bg-label">Planetary Canvas &mdash; <b>Kepler</b> <span style="opacity:.6">(mock render, non-interactive)</span></div>
  <div class="bg-crumbs-hint">Selection band exemplar &middot; fold &#8596; full screen (2-level)</div>

  <div class="dock">

    <!-- LEFT: hex grid -->
    <div class="col col-hex">
      <div class="col-title">Selected tile</div>
      <div class="hex-wrap"><svg id="hexSvg" viewBox="-95 -95 190 190"></svg></div>
      <div class="tile-id-line">Tile <b id="tileIdLabel">[97, 10]</b> &middot; <span id="tileTerrainLabel">Rocky Plain</span></div>
    </div>

    <!-- MIDDLE: metric card, folded resting state -->
    <div class="col col-metric">
      <div class="metric-card">

        <div class="card-header" id="cardHeader">
          <!-- filled by JS: pager + fold chevron -->
        </div>

        <div class="card-body" id="cardBody">
          <!-- filled by JS: the single folded line -->
        </div>

      </div>
    </div>

    <!-- RIGHT: action grid -->
    <div class="col col-actions">
      <div class="col-title">Actions</div>
      <div class="action-grid" id="actionGrid"></div>
    </div>

  </div>

  <!-- FULL-SCREEN expanded view: level 2, everything at once -->
  <div class="fs-overlay" id="fsOverlay">
    <div class="fs-inner">
      <div class="fs-header" id="fsHeader"></div>
      <div class="fs-body" id="fsBody"></div>
    </div>
  </div>

<script>
(function(){

  /* ================= deterministic pseudo-random (seeded, matches the
     sim's own "deterministic generation" ethos even though this is a mock) */
  function hashSeed(str){
    let h = 2166136261;
    for(let i=0;i<str.length;i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(seed){
    let a = seed;
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rngFor(seedStr){ return mulberry32(hashSeed(seedStr)); }

  /* ================= tile / hex model ================= */
  const AXIAL_DIRS = [
    {q:1,r:0,key:'n1'}, {q:1,r:-1,key:'n2'}, {q:0,r:-1,key:'n3'},
    {q:-1,r:0,key:'n4'}, {q:-1,r:1,key:'n5'}, {q:0,r:1,key:'n6'}
  ];
  const BASE_TILE = {x:97, y:10};
  const TERRAINS = ['Rocky Plain','Sedimentary Basin','Highland Ridge','Crater Field','Alluvial Flat','Fractured Mesa'];

  const RESOURCE_PAGES = ['Iron Ore','Copper Ore','Coal','Habitability','Hazard'];
  const RESOURCE_UNIT = {'Iron Ore':'/tick','Copper Ore':'/tick','Coal':'/tick'};

  function coordKey(x,y){ return x+','+y; }

  function buildTile(x, y){
    const key = coordKey(x,y);
    const rng = rngFor('tile:'+key);
    const terrain = TERRAINS[Math.floor(rng()*TERRAINS.length)];
    const resources = {};
    RESOURCE_PAGES.forEach(name=>{
      const rrng = rngFor('res:'+key+':'+name);
      if(name === 'Habitability'){
        resources[name] = { kind:'stat', value: Math.round(30 + rrng()*55), unit:'%', note:'Composite of temperature, atmosphere and water access.' };
        return;
      }
      if(name === 'Hazard'){
        resources[name] = { kind:'stat', value: Math.round(10 + rrng()*40), unit:'%', note:'Seismic + radiation exposure, drives the yield penalty above.' };
        return;
      }
      const base = 18 + rrng()*22;                 // 18-40 base yield
      const hazardFactor = 0.68 + rrng()*0.30;      // 0.68-0.98
      const thisTile = base * hazardFactor;
      const topDecile = thisTile / (0.58 + rrng()*0.30); // thisTile sits 10-40% below top decile
      const history = [];
      let walk = thisTile * (0.82 + rrng()*0.10);
      for(let i=0;i<12;i++){
        walk += (rrng()-0.42) * thisTile * 0.09;
        walk = Math.max(thisTile*0.5, walk);
        history.push(walk);
      }
      history[11] = thisTile; // last point = current reading
      resources[name] = {
        kind:'resource', base, hazardFactor, thisTile, topDecile, history
      };
    });
    return { x, y, key, terrain, resources };
  }

  const tiles = {};
  tiles.center = buildTile(BASE_TILE.x, BASE_TILE.y);
  AXIAL_DIRS.forEach(d=>{
    tiles[d.key] = buildTile(BASE_TILE.x + d.q, BASE_TILE.y + d.r);
  });

  /* ================= app state =================
     Two levels only: folded (default) and expanded (full screen, everything
     at once — what used to be Read+Study merges into one combined view). */
  const state = {
    selectedKey: 'center',
    pageIndex: 0,
    expanded: false,          // default: folded
    drill: null                // null, or { resource: 'Iron Ore', from: 'bar-this'|'bar-top' } — only reachable while expanded
  };

  function currentTile(){ return tiles[state.selectedKey]; }
  function currentResourceName(){ return RESOURCE_PAGES[state.pageIndex]; }
  function currentResource(){ return currentTile().resources[currentResourceName()]; }

  /* ================= hex grid render ================= */
  function hexPoints(size){
    const pts = [];
    for(let i=0;i<6;i++){
      const ang = Math.PI/180 * (60*i - 30);
      pts.push((size*Math.cos(ang)).toFixed(1) + ',' + (size*Math.sin(ang)).toFixed(1));
    }
    return pts.join(' ');
  }
  function hexPixel(q,r,size){
    const x = size*Math.sqrt(3)*(q + r/2);
    const y = size*1.5*r;
    return {x,y};
  }
  function renderHexGrid(){
    const svg = document.getElementById('hexSvg');
    const size = 34;
    const pts = hexPoints(size*0.92);
    let html = '';
    function cell(key, q, r, tile){
      const p = hexPixel(q,r,size);
      const isSel = key === state.selectedKey;
      html += `<g transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})">`
        + `<polygon class="hex-cell${isSel?' selected':''}" points="${pts}" data-key="${key}"></polygon>`
        + `<text class="hex-label${isSel?' selected-label':''}" y="4">${tile.x},${tile.y}</text>`
        + `</g>`;
    }
    cell('center', 0, 0, tiles.center);
    AXIAL_DIRS.forEach(d=> cell(d.key, d.q, d.r, tiles[d.key]));
    svg.innerHTML = html;
    svg.querySelectorAll('.hex-cell').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.selectedKey = el.getAttribute('data-key');
        state.pageIndex = 0;
        state.drill = null;
        renderAll();
      });
    });
  }

  /* ================= folded card header (pager + fold chevron) ================= */
  function renderHeader(){
    const header = document.getElementById('cardHeader');
    header.innerHTML = `
      <div class="pager">
        <button id="pagerPrev">&#8249;</button>
        <span class="pager-label"><b>${currentResourceName()}</b> <span class="pager-count">(${state.pageIndex+1}/${RESOURCE_PAGES.length})</span></span>
        <button id="pagerNext">&#8250;</button>
      </div>
      <div class="header-controls">
        <button class="fold-btn" id="foldOpenBtn" title="Expand to full screen">&#9662;</button>
        <button class="goto-btn" title="Go to on map (flavor only)">&#8250;</button>
      </div>
    `;
    header.querySelector('#pagerPrev').addEventListener('click', ()=>{
      state.pageIndex = (state.pageIndex - 1 + RESOURCE_PAGES.length) % RESOURCE_PAGES.length;
      renderAll();
    });
    header.querySelector('#pagerNext').addEventListener('click', ()=>{
      state.pageIndex = (state.pageIndex + 1) % RESOURCE_PAGES.length;
      renderAll();
    });
    header.querySelector('#foldOpenBtn').addEventListener('click', openExpanded);
  }

  /* ================= folded card body: one line, nothing else ================= */
  function renderBody(){
    const body = document.getElementById('cardBody');
    const name = currentResourceName();
    const res = currentResource();
    const t = currentTile();

    if(res.kind === 'stat'){
      body.innerHTML = `
        <div class="fold-row" id="foldRow">
          <span class="fold-chevron">&#9662;</span>
          <span class="glance-line">
            <span class="pip ${res.value>=60?'ok':res.value>=35?'warn':'bad'}"></span>
            <span>${name} &mdash; <b>${res.value}${res.unit}</b></span>
          </span>
        </div>
        <div class="fold-hint">Click to expand &mdash; full screen</div>
      `;
      body.querySelector('#foldRow').addEventListener('click', openExpanded);
      return;
    }

    const pctBelow = Math.round((1 - res.thisTile/res.topDecile) * 100);
    const pipClass = pctBelow <= 10 ? 'ok' : pctBelow <= 25 ? 'warn' : 'bad';
    const unit = RESOURCE_UNIT[name] || '/tick';

    body.innerHTML = `
      <div class="fold-row" id="foldRow">
        <span class="fold-chevron">&#9662;</span>
        <span class="glance-line">
          <span class="pip ${pipClass}"></span>
          <span>${name} &mdash; <b>${res.thisTile.toFixed(1)}${unit}</b>, ${pctBelow}% below top-decile tiles</span>
        </span>
      </div>
      <div class="glance-sub">Tile [${t.x}, ${t.y}] &middot; ${t.terrain}</div>
      <div class="fold-hint">Click to expand &mdash; full screen</div>
    `;
    body.querySelector('#foldRow').addEventListener('click', openExpanded);
  }

  /* ================= full-screen expanded view: level 2, everything at once ================= */
  function openExpanded(){
    state.expanded = true;
    state.drill = null;
    renderFullscreen();
  }
  function closeExpanded(){
    state.expanded = false;
    state.drill = null;
    document.getElementById('fsOverlay').classList.remove('open');
  }

  function renderFullscreen(){
    const overlay = document.getElementById('fsOverlay');
    if(!state.expanded){ overlay.classList.remove('open'); return; }
    overlay.classList.add('open');
    renderFsHeader();
    renderFsBody();
  }

  function renderFsHeader(){
    const header = document.getElementById('fsHeader');
    const t = currentTile();

    if(state.drill){
      header.innerHTML = `
        <div class="fs-breadcrumb">
          <button class="fs-back-btn" id="fsBackBtn" title="Back">&#8249;</button>
          <span class="crumb" data-to="root">Tile [${t.x}, ${t.y}]</span>
          <span class="crumb-sep">&rsaquo;</span>
          <span class="crumb" data-to="root">${state.drill.resource}</span>
          <span class="crumb-sep">&rsaquo;</span>
          <span class="crumb current">${state.drill.resource} history</span>
        </div>
        <div class="fs-header-controls">
          <button class="goto-btn" title="Go to on map (flavor only)">&#8250;</button>
          <button class="fs-fold-btn" id="fsFoldBtn" title="Fold back up">&#9652; Fold up</button>
        </div>
      `;
      header.querySelector('#fsBackBtn').addEventListener('click', ()=>{ state.drill = null; renderFullscreen(); });
      header.querySelector('.crumb[data-to="root"]').addEventListener('click', ()=>{ state.drill = null; renderFullscreen(); });
      header.querySelector('#fsFoldBtn').addEventListener('click', closeExpanded);
      return;
    }

    header.innerHTML = `
      <div class="fs-pager">
        <button id="fsPagerPrev">&#8249;</button>
        <span><b>${currentResourceName()}</b> <span class="fs-pager-count">(${state.pageIndex+1}/${RESOURCE_PAGES.length})</span></span>
        <button id="fsPagerNext">&#8250;</button>
      </div>
      <div class="fs-header-controls">
        <button class="goto-btn" title="Go to on map (flavor only)">&#8250;</button>
        <button class="fs-fold-btn" id="fsFoldBtn" title="Fold back up">&#9652; Fold up</button>
      </div>
    `;
    header.querySelector('#fsPagerPrev').addEventListener('click', ()=>{
      state.pageIndex = (state.pageIndex - 1 + RESOURCE_PAGES.length) % RESOURCE_PAGES.length;
      renderFullscreen();
    });
    header.querySelector('#fsPagerNext').addEventListener('click', ()=>{
      state.pageIndex = (state.pageIndex + 1) % RESOURCE_PAGES.length;
      renderFullscreen();
    });
    header.querySelector('#fsFoldBtn').addEventListener('click', closeExpanded);
  }

  /* ---- "why this chart" log: a closed-by-default note stating the question
     this specific chart answers and why this evidence justifies the answer.
     Not a tutorial — it never tells the player what to ask next, only what
     this one chart, here, is for. ---- */
  let whyCounter = 0;
  function whyBlockHtml(question, why){
    whyCounter++;
    const id = 'why-' + whyCounter;
    return `
      <button class="why-toggle" data-why-target="${id}">
        <span class="why-glyph">?</span> Why this chart
      </button>
      <div class="why-note" id="${id}">
        <div><div class="why-note-inner">
          <div class="why-q"><b>Answers:</b> ${question}</div>
          <div><b>Because:</b> ${why}</div>
        </div></div>
      </div>
    `;
  }
  function wireWhyToggles(root){
    root.querySelectorAll('.why-toggle').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const note = document.getElementById(btn.getAttribute('data-why-target'));
        note.classList.toggle('open');
      });
    });
  }

  function renderFsBody(){
    const bodyEl = document.getElementById('fsBody');
    if(state.drill){
      bodyEl.innerHTML = drillViewHtml();
      wireWhyToggles(bodyEl);
      return;
    }
    const name = currentResourceName();
    const res = currentResource();
    const t = currentTile();

    if(res.kind === 'stat'){
      bodyEl.innerHTML = `
        <div class="fs-glance-line">
          <span class="pip ${res.value>=60?'ok':res.value>=35?'warn':'bad'}"></span>
          <span>${name} &mdash; <b>${res.value}${res.unit}</b></span>
        </div>
        <div class="fs-glance-sub">Tile [${t.x}, ${t.y}] &middot; ${t.terrain}</div>
        <div class="fs-stat-note">${res.note} No chart history is tracked for non-yield stats in this pass &mdash; this is the whole record for this page.</div>
        ${whyBlockHtml(
          `Is ${t.x + ',' + t.y} a place I'd want population or hazard-sensitive buildings, on this axis alone?`,
          `${name.toLowerCase()} is a single composite scalar with no per-tile history tracked yet, so a bare number next to its own note is the honest limit of what this page can justify today &mdash; a chart would imply a precision that doesn't exist.`
        )}
      `;
      wireWhyToggles(bodyEl);
      return;
    }

    const pctBelow = Math.round((1 - res.thisTile/res.topDecile) * 100);
    const pipClass = pctBelow <= 10 ? 'ok' : pctBelow <= 25 ? 'warn' : 'bad';
    const maxVal = Math.max(res.thisTile, res.topDecile) * 1.18;
    const thisPct = (res.thisTile/maxVal*100).toFixed(1);
    const topPct = (res.topDecile/maxVal*100).toFixed(1);
    const threshPct = (res.topDecile/maxVal*100).toFixed(1);
    const unit = RESOURCE_UNIT[name] || '/tick';

    bodyEl.innerHTML = `
      <div class="fs-glance-line">
        <span class="pip ${pipClass}"></span>
        <span>${name} &mdash; <b>${res.thisTile.toFixed(1)}${unit}</b>, ${pctBelow}% below top-decile tiles</span>
      </div>
      <div class="fs-glance-sub">Tile [${t.x}, ${t.y}] &middot; ${t.terrain}</div>

      <div class="fs-legend-row">
        <div class="fs-legend-item"><span class="fs-legend-swatch" style="background:var(--green)"></span>This tile <span class="lv">${res.thisTile.toFixed(1)}${unit}</span></div>
        <div class="fs-legend-item"><span class="fs-legend-swatch" style="background:var(--grey)"></span>Top 10% <span class="lv">${res.topDecile.toFixed(1)}${unit}</span></div>
      </div>
      <div class="fs-chart">
        <div class="fs-gridline" style="bottom:25%"></div>
        <div class="fs-gridline" style="bottom:50%"></div>
        <div class="fs-gridline" style="bottom:75%"></div>
        <div class="fs-threshold-line" style="bottom:${threshPct}%"></div>
        <div class="fs-bar-col">
          <div class="fs-bar-value">${res.thisTile.toFixed(1)}</div>
          <div class="fs-bar this-tile" style="height:${thisPct}%" data-bar="this" title="Drill into ${name} history"></div>
          <div class="fs-bar-label">This tile</div>
        </div>
        <div class="fs-bar-col">
          <div class="fs-bar-value">${res.topDecile.toFixed(1)}</div>
          <div class="fs-bar top-decile" style="height:${topPct}%" data-bar="top" title="Drill into ${name} history"></div>
          <div class="fs-bar-label">Top 10%</div>
          <div class="fs-bar-hint">of surveyed tiles</div>
        </div>
      </div>

      <div class="fs-derivation">
        Hazard-adjusted yield: base <b>${res.base.toFixed(1)}${unit}</b> &times; <b>${res.hazardFactor.toFixed(2)}</b> hazard factor
        &rarr; <b>${res.thisTile.toFixed(1)}${unit}</b>.
      </div>
      <div class="fs-derivation-tag">Top-decile threshold marked above at ${res.topDecile.toFixed(1)}${unit}</div>

      ${whyBlockHtml(
        `Is this tile worth extracting ${name} from, compared to the best tiles I've already surveyed?`,
        `"This tile" and "Top 10%" are the two numbers a placement decision actually needs &mdash; not the raw yield alone, which says nothing about whether better ground exists elsewhere.`
      )}
    `;

    bodyEl.querySelectorAll('.fs-bar').forEach(bar=>{
      bar.addEventListener('click', ()=>{
        state.drill = { resource: name, from: bar.getAttribute('data-bar') };
        renderFullscreen();
      });
    });
    wireWhyToggles(bodyEl);
  }

  /* ================= drill (child card) view — inside the full-screen overlay ================= */
  function drillViewHtml(){
    const t = currentTile();
    const name = state.drill.resource;
    const res = t.resources[name];
    const history = res.history;
    const minV = Math.min(...history) * 0.92;
    const maxV = Math.max(...history) * 1.08;
    const W = 640, H = 220, pad = 10;
    const pts = history.map((v,i)=>{
      const x = pad + (i/(history.length-1)) * (W - pad*2);
      const y = H - pad - ((v-minV)/(maxV-minV)) * (H - pad*2);
      return {x,y,v};
    });
    const lineStr = pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const areaStr = `${pad},${H-pad} ` + lineStr + ` ${W-pad},${H-pad}`;
    const dots = pts.map((p,i)=> `<circle class="fs-lc-dot${i===pts.length-1?' current':''}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${i===pts.length-1?4.5:3}"></circle>`).join('');
    const gridlines = [0.25,0.5,0.75].map(f=> `<line class="fs-lc-grid" x1="${pad}" x2="${W-pad}" y1="${(H-pad*2)*f+pad}" y2="${(H-pad*2)*f+pad}"></line>`).join('');

    const first = history[0], last = history[history.length-1];
    const trendPct = Math.round((last-first)/first*100);

    return `
      <div class="fs-drill-hint">Output over the last 12 ticks, from the ${state.drill.from === 'this' ? '&ldquo;This tile&rdquo;' : '&ldquo;Top 10%&rdquo;'} bar.</div>
      <div class="fs-line-chart-wrap">
        <svg viewBox="0 0 ${W} ${H}">
          <defs>
            <linearGradient id="lcGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#6EC878" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#6EC878" stop-opacity="0"/>
            </linearGradient>
          </defs>
          ${gridlines}
          <polygon class="fs-lc-area" points="${areaStr}"></polygon>
          <polyline class="fs-lc-line" points="${lineStr}"></polyline>
          ${dots}
          <text class="fs-lc-axis-label" x="${pad}" y="${H+16}">T-11</text>
          <text class="fs-lc-axis-label" x="${W-pad}" y="${H+16}" text-anchor="end">T-0</text>
        </svg>
      </div>
      <div class="fs-drill-stats">
        <div class="fs-drill-stat"><span>Current</span><b>${last.toFixed(1)}/tick</b></div>
        <div class="fs-drill-stat"><span>12-tick ago</span><b>${first.toFixed(1)}/tick</b></div>
        <div class="fs-drill-stat"><span>Trend</span><b style="color:${trendPct>=0?'var(--green)':'var(--red)'}">${trendPct>=0?'+':''}${trendPct}%</b></div>
      </div>

      ${whyBlockHtml(
        `Is ${name} output on this tile trending up or down, not just what it reads right now?`,
        `A single-tick reading can't distinguish a temporary dip from a structural decline; twelve ticks is enough history to tell the two apart without asking the player to remember last quarter's number themselves.`
      )}
    `;
  }

  /* ================= right column: action grid ================= */
  const ICONS = {
    construct: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20h16M6 20V10l6-5 6 5v10M10 20v-6h4v6"/></svg>`,
    manage: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>`,
    history: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>`,
    supply: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h13M12 6l6 6-6 6"/></svg>`
  };
  function renderActionGrid(){
    const grid = document.getElementById('actionGrid');
    const items = [
      {label:'Construct', icon:ICONS.construct},
      {label:'Manage', icon:ICONS.manage},
      {label:'History', icon:ICONS.history},
      {label:'Supply', icon:ICONS.supply},
      {label:'&mdash;', placeholder:true},
      {label:'&mdash;', placeholder:true}
    ];
    grid.innerHTML = items.map(it=>`
      <div class="action-btn${it.placeholder?' placeholder':''}">
        ${it.icon || ''}
        <span>${it.label}</span>
      </div>
    `).join('');
  }

  /* ================= misc ================= */
  function updateHexLabel(){
    const t = currentTile();
    document.getElementById('tileIdLabel').textContent = `[${t.x}, ${t.y}]`;
    document.getElementById('tileTerrainLabel').textContent = t.terrain;
  }

  function renderAll(){
    renderHexGrid();
    updateHexLabel();
    renderHeader();
    renderBody();
    renderFullscreen();
  }

  renderActionGrid();
  renderAll();

})();
</script>
</body>
</html>
