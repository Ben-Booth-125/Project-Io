# Cross-platform build guard (BL-057).
#
# Linux is the primary dev OS and Windows is the playtest OS, so this workflow's
# job is to catch cross-platform drift automatically: it builds the full app on
# both OSes and runs the SDL/Lua/ImGui-free headless harnesses on Linux. The
# visual-verify tier (ProjectIo --verify) is intentionally NOT run here yet — it
# needs an offscreen renderer (SDL_VIDEODRIVER=dummy / Xvfb), which is the
# deferred spike in BL-057. Dependencies are fetched by CMake FetchContent and
# cached on the CMakeLists hash to keep runs cheap.
#
# NOTE: the headless-harness job (the Linux build's second step) has been verified
# locally on a native Linux toolchain (g++ 13, the exact recipe below) — all seven
# tools/verify/*.cpp harnesses build and pass. The full-app build steps (CMake
# FetchContent → SDL3/Lua/sol2/ImGui) still run for the first time in CI, since the
# dev sandbox's egress policy blocks the GitHub clones FetchContent needs; expect
# the first Actions run to possibly need an apt-dep tweak for the SDL3 build.

name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    # Matrix over GCC 13 (ubuntu-latest default) and GCC 14. The 14 leg is the
    # standing guard for BL-057: GCC 14+ parses template bodies strictly and
    # rejected the old sol2 v3.3.0 (fixed by the v3.5.0 bump), and the default
    # runner compiler wouldn't catch a regression of that. fail-fast off so a
    # break on one compiler still reports the other.
    name: Linux ${{ matrix.cxx }} (build + headless harnesses)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc-13, cxx: g++-13 }
          - { cc: gcc-14, cxx: g++-14 }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build + SDL3 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            ${{ matrix.cc }} ${{ matrix.cxx }} \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxss-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libpulse-dev libasound2-dev

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          # Key on the compiler too — the two legs build the deps separately.
          key: deps-${{ runner.os }}-${{ matrix.cxx }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        # CC / CXX from the matrix env steer CMake's compiler selection.
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build ProjectIo
        run: cmake --build build -j

      - name: Build + run headless harnesses
        shell: bash
        run: |
          # Link each tools/verify/*.cpp against every world/*.cpp except
          # recipe_registry.cpp and tech_tree.cpp (the TUs that pull sol2/Lua). This is a
          # superset of each harness's hand-listed sources, so it stays correct
          # as those lists evolve. See tools/verify/README.md for the per-harness
          # MSVC recipes. Use the matrix compiler ($CXX) so both legs exercise
          # the headless tier too.
          set -euo pipefail
          WORLD=$(ls src/world/*.cpp | grep -v -e 'recipe_registry.cpp' -e 'tech_tree.cpp')
          fail=0
          for h in tools/verify/*.cpp; do
            name=$(basename "$h" .cpp)
            # pregame_balance_harness is the lone harness that needs a live Lua
            # state (sol2 + lua54 + recipe_registry.cpp + scripting/lua_state.cpp),
            # so it is NOT part of this pure world/* headless tier. It is still
            # compiled on both OSes by the full `cmake --build` step above (via its
            # CTest target); running it here would add nothing — it is a diagnostic
            # print harness that always exits 0.
            if [ "$name" = "pregame_balance_harness" ]; then
              echo "=== skipping $name (needs Lua; built via CMake/CTest target) ==="
              continue
            fi
            echo "=== building $name ==="
            "${CXX:-g++}" -std=c++20 -O2 -I src "$h" $WORLD -o "/tmp/$name"
            echo "=== running $name ==="
            if ! "/tmp/$name"; then
              echo "::error::headless harness $name failed"
              fail=1
            fi
          done
          exit $fail

  windows:
    name: Windows (build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build

      - name: Build ProjectIo
        run: cmake --build build --config Release

  visual-verify:
    # ADVISORY headless visual-verify spike (BL-057 step 4). Runs ProjectIo
    # --verify under Xvfb (a virtual X server — no monitor needed; the capture
    # uses SDL_RenderReadPixels, which is renderer-agnostic) and uploads the PNG
    # captures + golden-diff images as artifacts. SDL_RENDER_DRIVER=software
    # forces the deterministic software rasteriser, so output is GPU-independent.
    #
    # NOT a gate yet (continue-on-error): the committed goldens were blessed on a
    # GPU renderer and may diff against the software rasteriser beyond the 0.5 %
    # tolerance. This run exists to *see* the software-rendered output and decide
    # whether to re-bless goldens in CI before promoting this to a hard gate.
    name: Linux visual-verify (Xvfb, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SDL_RENDER_DRIVER: software
    steps:
      - uses: actions/checkout@v4

      - name: Install build + SDL3 + Xvfb dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build xvfb \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxss-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libpulse-dev libasound2-dev

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          # Reuse the g++-13 leg's dependency build (default runner compiler).
          key: deps-${{ runner.os }}-g++-13-${{ hashFiles('CMakeLists.txt') }}
          path: build/_deps

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build ProjectIo
        run: cmake --build build -j

      - name: Run visual-verify scripts under Xvfb (advisory)
        shell: bash
        run: |
          # Advisory: no `set -e`. Each script's --verify exit code (non-zero on
          # a golden diff) is recorded but never fails the step — we want every
          # capture produced and uploaded regardless. Run from the repo root so
          # the cwd-relative bundled font (assets/fonts/) and the scripts/verify
          # golden dir both resolve.
          set -uo pipefail
          mkdir -p screenshots
          pass=0; diffed=0
          for s in scripts/verify/*.lua; do
            [ "$(basename "$s")" = "lib.lua" ] && continue
            echo "=== verify: $s ==="
            if xvfb-run -a ./build/ProjectIo --verify "$s"; then
              pass=$((pass+1))
            else
              echo "::warning::visual-verify advisory: $s reported golden diffs/failures"
              diffed=$((diffed+1))
            fi
          done
          echo "advisory summary: $pass clean, $diffed reported diffs/failures"

      - name: Upload captures + diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-verify-captures
          path: screenshots/**
          if-no-files-found: warn
